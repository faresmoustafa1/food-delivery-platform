# Render Blueprint - deploys the whole platform on Render's free tier.
#   Render dashboard -> New -> Blueprint -> pick this repository.
#
#   albab-db       PostgreSQL 16 (Flyway creates the schema + demo data on boot)
#   albab-api      Spring Boot backend, built from backend/Dockerfile
#   albab          Angular frontend as a static site; /api/* is proxied to albab-api
#
# Free-tier limits: the API sleeps after 15 minutes idle (first request then
# takes ~1 minute), and the free database expires 30 days after creation.

databases:
  - name: albab-db
    plan: free
    region: frankfurt
    databaseName: talabaty_db
    postgresMajorVersion: '16'

services:
  - type: web
    name: albab-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/categories
    envVars:
      - key: DB_HOST
        fromDatabase: { name: albab-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: albab-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: albab-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: albab-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: albab-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_ENABLED
        value: 'false'
      - key: CORS_ALLOWED_ORIGINS
        value: https://albab.onrender.com
      # The free instance has 512 MB; let the JVM use most of it.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75

  - type: web
    name: albab
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/talabat-frontend/browser
    envVars:
      - key: NODE_VERSION
        value: '24'
    routes:
      # The production bundle calls /api/... on its own origin (apiUrl is
      # empty). Render proxies those calls to the backend, so there is no CORS.
      # If Render gives the API a different URL than this, update it here.
      - type: rewrite
        source: /api/*
        destination: https://albab-api.onrender.com/api/*
      # Angular client-side routing: deep links fall back to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
